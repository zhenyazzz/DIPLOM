# Minimal stack for auth + admin users UI:
#   postgres + identity + gateway
# Frontend (Vite) proxies /api → http://localhost:8090
#
# Before build, package jars:
#   mvn -f "Project Portfolio Optimization System/libs/common-security/pom.xml" install -DskipTests
#   mvn -f "Project Portfolio Optimization System/libs/common-web/pom.xml" install -DskipTests
#   mvn -f "Project Portfolio Optimization System/services/identity/pom.xml" package -DskipTests
#   mvn -f "Project Portfolio Optimization System/services/gateway/pom.xml" package -DskipTests
#
# Run:
#   set CORE_JWT_SECRET=change-me-change-me-change-me-32b
#   docker compose up --build
#
# Seed admin: admin@portfolio.local / Admin123!

services:
  postgres:
    image: postgres:17-alpine
    container_name: portfolio-postgres
    environment:
      POSTGRES_DB: portfolio_core
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5432:5432"
    volumes:
      - portfolio_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_core"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: "./Project Portfolio Optimization System/services/identity"
    container_name: portfolio-identity
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio_core
      SPRING_DATASOURCE_USERNAME: portfolio
      SPRING_DATASOURCE_PASSWORD: portfolio
      CORE_JWT_SECRET: ${CORE_JWT_SECRET:?set CORE_JWT_SECRET (>= 32 bytes)}
      CORE_COOKIE_SECURE: "false"

  gateway:
    build:
      context: "./Project Portfolio Optimization System/services/gateway"
    container_name: portfolio-gateway
    ports:
      - "8090:8090"
    depends_on:
      identity:
        condition: service_started
    environment:
      CORE_JWT_SECRET: ${CORE_JWT_SECRET:?set CORE_JWT_SECRET (>= 32 bytes)}
      IDENTITY_URL: http://identity:8080
      GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:5173

