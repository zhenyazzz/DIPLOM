services:
  postgres:
    image: postgres:17-alpine
    container_name: portfolio-postgres
    environment:
      POSTGRES_DB: portfolio_core
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5432:5432"
    volumes:
      - portfolio_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_core"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO no longer publishes community images; Chainguard builds them from source.
    # The free tier only has floating tags, so pin by digest (-dev variant ships wget for the healthcheck).
    # MinIO RELEASE.2026-11-12T01-15-23Z
    image: cgr.dev/chainguard/minio:latest-dev@sha256:5735e8125c4af7dd310dc5780508bfb850f0b68783a1a56089b5c64316a8f603
    container_name: portfolio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: portfolio
      MINIO_ROOT_PASSWORD: portfolio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - portfolio_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    profiles: [apps]
    build: ../services/identity
    container_name: portfolio-identity
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio_core
      SPRING_DATASOURCE_USERNAME: portfolio
      SPRING_DATASOURCE_PASSWORD: portfolio
      CORE_JWT_SECRET: ${CORE_JWT_SECRET:?set CORE_JWT_SECRET (>= 32 bytes)}

  domain:
    profiles: [apps]
    build: ../services/domain
    container_name: portfolio-domain
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio_core
      SPRING_DATASOURCE_USERNAME: portfolio
      SPRING_DATASOURCE_PASSWORD: portfolio
      CORE_JWT_SECRET: ${CORE_JWT_SECRET:?set CORE_JWT_SECRET (>= 32 bytes)}
      CALC_URL: http://calc:8081
      FINANCE_URL: http://finance:8082
      FTS_URL: http://fts:8083
      NOTIFY_URL: http://notify:8087

  calc:
    profiles: [apps]
    build: ../services/calc
    container_name: portfolio-calc
    ports:
      - "8081:8081"
    environment:
      CORE_JWT_SECRET: ${CORE_JWT_SECRET:?set CORE_JWT_SECRET (>= 32 bytes)}

  finance:
    profiles: [apps]
    build: ../services/finance
    container_name: portfolio-finance
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      fts:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio_core
      SPRING_DATASOURCE_USERNAME: portfolio
      SPRING_DATASOURCE_PASSWORD: portfolio
      CORE_JWT_SECRET: ${CORE_JWT_SECRET:?set CORE_JWT_SECRET (>= 32 bytes)}
      FTS_URL: http://fts:8083
      NOTIFY_URL: http://notify:8087

  notify:
    profiles: [apps]
    build: ../services/notify
    container_name: portfolio-notify
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio_core
      SPRING_DATASOURCE_USERNAME: portfolio
      SPRING_DATASOURCE_PASSWORD: portfolio
      CORE_JWT_SECRET: ${CORE_JWT_SECRET:?set CORE_JWT_SECRET (>= 32 bytes)}
      NOTIFY_EMAIL_MODE: stub

  fts:
    profiles: [apps]
    build: ../services/fts
    container_name: portfolio-fts
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio_core
      SPRING_DATASOURCE_USERNAME: portfolio
      SPRING_DATASOURCE_PASSWORD: portfolio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: portfolio
      MINIO_SECRET_KEY: portfolio-secret
      CORE_JWT_SECRET: ${CORE_JWT_SECRET:?set CORE_JWT_SECRET (>= 32 bytes)}

  gateway:
    profiles: [apps]
    build: ../services/gateway
    container_name: portfolio-gateway
    ports:
      - "8090:8090"
    depends_on:
      identity:
        condition: service_started
      domain:
        condition: service_started
      notify:
        condition: service_started
    environment:
      CORE_JWT_SECRET: ${CORE_JWT_SECRET:?set CORE_JWT_SECRET (>= 32 bytes)}
      IDENTITY_URL: http://identity:8080
      DOMAIN_URL: http://domain:8084
      FINANCE_URL: http://finance:8082
      NOTIFY_URL: http://notify:8087

volumes:
  portfolio_pg_data:
  portfolio_minio_data:
