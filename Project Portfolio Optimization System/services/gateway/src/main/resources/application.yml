server:
  port: ${GATEWAY_PORT:8090}
  forward-headers-strategy: framework

spring:
  application:
    name: portfolio-gateway
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
  http:
    clients:
      connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:2s}
      read-timeout: ${GATEWAY_READ_TIMEOUT:30s}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-auth
              uri: ${IDENTITY_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/auth/**
            - id: identity-users
              uri: ${IDENTITY_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/users/**
            - id: identity-admin
              uri: ${IDENTITY_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/admin/**
            - id: domain-reference
              uri: ${DOMAIN_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/reference/**
            - id: domain-projects
              uri: ${DOMAIN_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/projects/**
            - id: domain-criteria
              uri: ${DOMAIN_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/criteria/**
            - id: domain-scoring-models
              uri: ${DOMAIN_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/scoring-models/**
            - id: domain-assessments
              uri: ${DOMAIN_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/assessments/**
            - id: domain-scores
              uri: ${DOMAIN_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/scores/**
            - id: finance
              uri: ${FINANCE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/finance/**
            - id: domain-scenarios
              uri: ${DOMAIN_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/scenarios/**
            - id: domain-runs
              uri: ${DOMAIN_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/runs/**
            - id: domain-approvals
              uri: ${DOMAIN_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/approvals/**
            - id: domain-reports
              uri: ${DOMAIN_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/reports/**
            - id: domain-audit
              uri: ${DOMAIN_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/audit/**
            - id: notify-notifications
              uri: ${NOTIFY_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health

portfolio:
  security:
    jwt:
      secret: ${CORE_JWT_SECRET:}
    permit-all:
      - POST:/api/v1/auth/register
      - POST:/api/v1/auth/login
      - POST:/api/v1/auth/refresh
      - POST:/api/v1/auth/logout
      - GET:/actuator/health
      - POST:/graphql
      - GET:/graphql
      - GET:/graphiql
      - GET:/graphiql/**

gateway:
  identity-url: ${IDENTITY_URL:http://localhost:8080}
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  login-rate-limit:
    capacity: ${GATEWAY_LOGIN_RATE_LIMIT_CAPACITY:5}
    window: ${GATEWAY_LOGIN_RATE_LIMIT_WINDOW:1m}
