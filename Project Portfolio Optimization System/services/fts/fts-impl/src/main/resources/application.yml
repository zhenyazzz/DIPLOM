server:
  port: ${FTS_PORT:8083}

spring:
  application:
    name: portfolio-fts
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio_core}
    username: ${SPRING_DATASOURCE_USERNAME:portfolio}
    password: ${SPRING_DATASOURCE_PASSWORD:portfolio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: fts
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: fts
    default-schema: fts
    create-schemas: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

management:
  endpoints:
    web:
      exposure:
        include: health

portfolio:
  security:
    jwt:
      secret: ${CORE_JWT_SECRET:}
    permit-all:
      - GET:/actuator/health

fts:
  download-url-ttl: 5m
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:portfolio}
    secret-key: ${MINIO_SECRET_KEY:portfolio-secret}
    region: us-east-1
  buckets:
    imports:
      name: fts-imports
      max-size: 20MB
      content-types:
        - text/csv
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    reports:
      name: fts-reports
      max-size: 20MB
      content-types:
        - application/pdf
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    attachments:
      name: fts-attachments
      max-size: 50MB
      content-types:
        - application/pdf
        - image/png
        - image/jpeg
        - text/plain
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
