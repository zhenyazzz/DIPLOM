openapi: 3.0.3
info:
  title: Identity API
  version: 1.0.0
  description: Auth and users (JWT issuance). Admin under /api/v1/admin/users.
servers:
  - url: /
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register initiator
      responses:
        '201':
          description: Created
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Login
      responses:
        '200':
          description: Tokens
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Refresh access token
      responses:
        '200':
          description: Tokens
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Logout
      responses:
        '204':
          description: No content
  /api/v1/users/me:
    get:
      operationId: me
      summary: Current user
      responses:
        '200':
          description: User
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: Admin list users
      responses:
        '200':
          description: Users
  /api/v1/admin/users/{userId}/role:
    put:
      operationId: changeRole
      summary: Admin change user role
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated user
  /api/v1/admin/users/{userId}/blocked:
    put:
      operationId: setBlocked
      summary: Admin block or unblock user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated user
