openapi: 3.0.3
info:
  title: Identity API
  version: 1.0.0
  description: Auth and users (JWT issuance).
servers:
  - url: /
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register initiator
      responses:
        '201':
          description: Created
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Login
      responses:
        '200':
          description: Tokens
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Refresh access token
      responses:
        '200':
          description: Tokens
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Logout
      responses:
        '204':
          description: No content
  /api/v1/users/me:
    get:
      operationId: me
      summary: Current user
      responses:
        '200':
          description: User
  /api/v1/users:
    get:
      operationId: listUsers
      summary: Admin list users
      responses:
        '200':
          description: Users
