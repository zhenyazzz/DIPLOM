openapi: 3.0.3
info:
  title: Domain API
  version: 0.2.0
  description: >
    Reference, projects, scoring data, scenarios, runs, approvals, reports, audit.
    Replaces transitional project-v1 / scoring-v1 / portfolio-v1.
servers:
  - url: /
paths:
  /api/v1/reference/departments:
    get:
      operationId: listDepartments
      summary: List departments
      responses:
        '200':
          description: OK
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Statuses'
        - $ref: '#/components/parameters/DepartmentCode'
        - $ref: '#/components/parameters/MinBudget'
        - $ref: '#/components/parameters/MaxBudget'
        - $ref: '#/components/parameters/GoalCode'
        - $ref: '#/components/parameters/ExcludeArchived'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectCardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: registerProject
      summary: Register a draft initiative
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterProjectRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/projects/stats:
    get:
      operationId: projectRegistryStats
      summary: Registry stats for the current filter
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Statuses'
        - $ref: '#/components/parameters/DepartmentCode'
        - $ref: '#/components/parameters/MinBudget'
        - $ref: '#/components/parameters/MaxBudget'
        - $ref: '#/components/parameters/GoalCode'
        - $ref: '#/components/parameters/ExcludeArchived'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRegistryStatsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/projects/{id}:
    get:
      operationId: getProject
      summary: Get project card
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCardResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{id}/submit:
    post:
      operationId: submitProject
      summary: Submit a draft or returned initiative
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{id}/start-review:
    post:
      operationId: startProjectReview
      summary: Start review of a submitted initiative
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{id}/complete-evaluation:
    post:
      operationId: completeProjectEvaluation
      summary: Complete evaluation
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{id}/approve:
    post:
      operationId: approveProjectForPortfolio
      summary: Approve an evaluated initiative for the portfolio
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{id}/return:
    post:
      operationId: returnProjectForRevision
      summary: Return an initiative for revision
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Reason'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusReasonRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{id}/reject:
    post:
      operationId: rejectProject
      summary: Reject an initiative
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Reason'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusReasonRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{id}/archive:
    post:
      operationId: archiveProject
      summary: Archive a draft, rejected, or returned initiative
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/criteria:
    get:
      operationId: listCriteria
      summary: List criteria
      responses:
        '200':
          description: OK
  /api/v1/scoring-models:
    get:
      operationId: listScoringModels
      summary: List scoring models
      responses:
        '200':
          description: OK
  /api/v1/assessments:
    get:
      operationId: listAssessments
      summary: List assessments
      responses:
        '200':
          description: OK
  /api/v1/scores:
    get:
      operationId: listScores
      summary: List project scores
      responses:
        '200':
          description: OK
  /api/v1/scenarios:
    get:
      operationId: listScenarios
      summary: List scenarios
      responses:
        '200':
          description: OK
  /api/v1/scenarios/{id}/runs:
    post:
      operationId: startRun
      summary: Start optimization job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Accepted job
  /api/v1/runs/{id}:
    get:
      operationId: getRun
      summary: Run status and result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /api/v1/approvals:
    get:
      operationId: listApprovals
      summary: List approvals (ЛПР inbox / filters)
      responses:
        '200':
          description: OK
  /api/v1/scenarios/{id}/approvals:
    post:
      operationId: decideApproval
      summary: Submit decision for a scenario run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Decision recorded
        '201':
          description: Approval created
  /api/v1/reports:
    get:
      operationId: listReports
      summary: List reports
      responses:
        '200':
          description: OK
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: List audit entries
      responses:
        '200':
          description: OK
components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Status:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ProjectStatus'
    Statuses:
      name: statuses
      in: query
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ProjectStatus'
    DepartmentCode:
      name: departmentCode
      in: query
      required: false
      schema:
        type: string
    MinBudget:
      name: minBudget
      in: query
      required: false
      schema:
        type: number
    MaxBudget:
      name: maxBudget
      in: query
      required: false
      schema:
        type: number
    GoalCode:
      name: goalCode
      in: query
      required: false
      schema:
        type: string
    ExcludeArchived:
      name: excludeArchived
      in: query
      required: false
      schema:
        type: boolean
        default: true
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [CODE, TITLE, REQUESTED_BUDGET, STATUS]
        default: CODE
    Direction:
      name: direction
      in: query
      required: false
      schema:
        type: string
        enum: [ASC, DESC]
        default: ASC
    Reason:
      name: reason
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation error or illegal status transition
    NotFound:
      description: Project not found
    Conflict:
      description: Project code already exists
  schemas:
    ProjectStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - UNDER_REVIEW
        - EVALUATED
        - APPROVED_FOR_PORTFOLIO
        - REJECTED
        - RETURNED_FOR_REVISION
        - ARCHIVED
    RegisterProjectRequest:
      type: object
      required: [code, title, departmentId, ownerId, requestedBudget, goals]
      properties:
        code:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        departmentId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        requestedBudget:
          type: number
          minimum: 0
        goals:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GoalContributionInput'
    GoalContributionInput:
      type: object
      required: [goalId, level]
      properties:
        goalId:
          type: string
          format: uuid
        level:
          type: integer
          minimum: 1
          maximum: 5
    StatusReasonRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
    ProjectCardResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ProjectStatus'
        requestedBudget:
          type: number
        department:
          $ref: '#/components/schemas/DepartmentSummaryResponse'
        ownerId:
          type: string
          format: uuid
        goals:
          type: array
          items:
            $ref: '#/components/schemas/GoalContributionResponse'
    DepartmentSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    GoalContributionResponse:
      type: object
      properties:
        goal:
          $ref: '#/components/schemas/StrategicGoalSummaryResponse'
        level:
          type: integer
    StrategicGoalSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    ProjectRegistryStatsResponse:
      type: object
      properties:
        totalCount:
          type: integer
          format: int64
        byStatus:
          type: array
          items:
            $ref: '#/components/schemas/StatusCountResponse'
        totalRequestedBudget:
          type: number
        budgetByDepartment:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentBudgetStatResponse'
    StatusCountResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ProjectStatus'
        count:
          type: integer
          format: int64
    DepartmentBudgetStatResponse:
      type: object
      properties:
        departmentCode:
          type: string
        totalRequestedBudget:
          type: number
